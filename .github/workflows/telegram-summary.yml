name: Telegram Summary

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  id-token: write

# Opt actions onto Node 24 ahead of GitHub's June 2026 forced cutoff.
# Covers transitive Node 20 actions inside claude-code-base-action.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # PR merged — announce shipped work
  notify-pr-merged:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate diff
        run: git diff HEAD^ HEAD > changes.diff

      - name: Generate summary with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file 'changes.diff'.
            This is a Pull Request that has just been MERGED into the '${{ github.event.pull_request.base.ref }}' branch — the changes are now live on that branch.
            PR Title: ${{ github.event.pull_request.title }}
            PR Author: ${{ github.event.pull_request.user.login }}
            Summarize the shipped changes concisely for a Telegram update aimed at non-technical founders.
            Start the message with this exact header (preserve the blank line between line 1 and line 3):
            Line 1: '<b>${{ github.event.repository.name }}</b>'
            Line 2: (empty blank line)
            Line 3: '🚀 <b>PR Merged → ${{ github.event.pull_request.base.ref }}</b>'
            Line 4: '<b>Author:</b> ${{ github.event.pull_request.user.login }}'
            Make it clear this work is now on the branch (merged, not just proposed).
            Focus on functional changes and their impact.
            Skip line numbers, file hashes, and other low-level technical detail.
            Format using Telegram HTML: <b>bold</b>, <i>italic</i>, <code>code</code>. Do NOT use Markdown asterisks.
            Write the result to a file named 'summary.txt'.
          claude_args: '--model claude-haiku-4-5 --allowed-tools "Bash(cat),Bash(grep),Bash(ls),Bash(echo),Write,Read"'

      - name: Send to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f summary.txt ] || { echo "summary.txt missing"; exit 0; }
          python3 - <<'PY'
          import os, sys, json
          from urllib import request, error
          token, chat_id = os.environ.get('BOT_TOKEN'), os.environ.get('CHAT_ID')
          if not token or not chat_id:
              print('Missing Telegram secrets'); sys.exit(1)
          text = open('summary.txt').read().strip()
          if not text:
              print('Empty summary, skipping'); sys.exit(0)
          req = request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          try:
              with request.urlopen(req) as r: print('Sent')
          except error.HTTPError as e:
              print('Failed:', e.read().decode()); sys.exit(1)
          PY

  # Direct commit to main — skip when this push is the result of a PR merge
  # (the PR-merged job above already handled it).
  notify-direct-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect PR-merge push
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If this commit SHA is associated with a merged PR, skip — PR-merged job handles it.
          # Covers merge commits, squash merges, and rebase merges.
          PR_COUNT=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$PR_COUNT" != "0" ]; then
            echo "Skipping: this push originates from a merged PR"
          fi

      - name: Generate diff
        if: steps.detect.outputs.pr_count == '0'
        run: git diff HEAD^ HEAD > changes.diff

      # Note: claude-code-action@v1 rejects push events, so use the lower-level
      # base action here. Same OAuth token, same model, no PR-event restriction.
      - name: Generate summary with Claude
        if: steps.detect.outputs.pr_count == '0'
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file 'changes.diff'.
            This is a DIRECT commit pushed straight to the '${{ github.ref_name }}' branch.
            Commit author: ${{ github.event.head_commit.author.name }}
            Commit message: ${{ github.event.head_commit.message }}
            Summarize the changes concisely for a Telegram update aimed at non-technical founders.
            Start the message with this exact header (preserve the blank line between line 1 and line 3):
            Line 1: '<b>${{ github.event.repository.name }}</b>'
            Line 2: (empty blank line)
            Line 3: '🚀 <b>Direct Commit → ${{ github.ref_name }}</b>'
            Line 4: '<b>Author:</b> ${{ github.event.head_commit.author.name }}'
            Focus on functional changes and their impact.
            Skip line numbers, file hashes, and other low-level technical detail.
            Do NOT add any warnings, cautions, or notes about bypassing PR review or code review safeguards — the header already indicates it's a direct commit.
            Format using Telegram HTML: <b>bold</b>, <i>italic</i>, <code>code</code>. Do NOT use Markdown asterisks.
            Write the result to a file named 'summary.txt'.
          model: claude-haiku-4-5
          allowed_tools: Read,Write
          max_turns: 10

      - name: Send to Telegram
        if: success() && steps.detect.outputs.pr_count == '0'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f summary.txt ] || { echo "summary.txt missing"; exit 0; }
          python3 - <<'PY'
          import os, sys, json
          from urllib import request, error
          token, chat_id = os.environ.get('BOT_TOKEN'), os.environ.get('CHAT_ID')
          if not token or not chat_id:
              print('Missing Telegram secrets'); sys.exit(1)
          text = open('summary.txt').read().strip()
          if not text:
              print('Empty summary, skipping'); sys.exit(0)
          req = request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          try:
              with request.urlopen(req) as r: print('Sent')
          except error.HTTPError as e:
              print('Failed:', e.read().decode()); sys.exit(1)
          PY
